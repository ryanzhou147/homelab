# Home page look. The photo is from Unsplash (free license), stored in images/.
title: Home lab
theme: dark
color: slate
headerStyle: boxed
background:
  image: /images/background.jpg
  blur: sm
  brightness: 75
cardBlur: md
statusStyle: dot
hideVersion: true
useEqualHeights: true
target: _self
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  hideVisitURL: true
# Three columns side by side, so the whole page fits on one screen.
layout:
  Watch:
    style: column
  Listen:
    style: column
  Download:
    style: column
