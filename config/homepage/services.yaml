# Each card links to the app and shows its live numbers. Homepage calls the apps on 127.0.0.1
# (the PC's ports); the keys come from homepage.env ('homelab homepage-secrets').
- Watch:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://{{HOMEPAGE_VAR_HOST}}/video/
        siteMonitor: http://127.0.0.1:8096/video/health
        widgets:
          - type: jellyfin
            # Version 2 uses Jellyfin's current API; Jellyfin 12 has no /emby paths.
            version: 2
            url: http://127.0.0.1:8096/video
            key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
            enableBlocks: true
            enableNowPlaying: true
          - type: customapi
            # Newest episodes and movies, from 'homelab recent', which adds the episode numbers.
            url: http://127.0.0.2:3010/status/recent.json
            headers:
              Host: "{{HOMEPAGE_VAR_HOST}}"
            refreshInterval: 60000
            display: dynamic-list
            mappings:
              items: jellyfin
              name: name
              label: label
    - Requests:
        icon: jellyseerr.svg
        description: Ask for a show or movie
        href: https://{{HOMEPAGE_VAR_HOST}}/requests
        siteMonitor: http://127.0.0.1:5055/api/v1/status
        widgets:
          - type: seerr
            url: http://127.0.0.1:5055
            key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
          # Seerr's API gives no titles, so the list comes from what Sonarr and Radarr expect.
          - type: calendar
            view: agenda
            maxEvents: 3
            previousDays: 3
            showTime: true
            integrations:
              - type: sonarr
                service_group: Download
                service_name: Sonarr
                index: 0  # its first widget; the default is this calendar's own position
              - type: radarr
                service_group: Download
                service_name: Radarr
                index: 0  # its first widget; the default is this calendar's own position
    - Bazarr:
        icon: bazarr.svg
        href: https://{{HOMEPAGE_VAR_HOST}}/bazarr/
        siteMonitor: http://127.0.0.1:6767/bazarr/api/system/ping
        widget:
          type: bazarr
          url: http://127.0.0.1:6767/bazarr
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
    - Job Tracker:
        icon: mdi-briefcase-search
        description: Cron, every 4h
        widget:
          type: customapi
          url: http://127.0.0.2:3010/status/job-tracker.json
          headers:
            Host: "{{HOMEPAGE_VAR_HOST}}"
          refreshInterval: 60000
          display: list
          mappings:
            - field: status
              label: Status
              remap:
                - value: ok
                  to: Healthy
                - value: engine_down
                  to: Engine down
                - value: token_expired
                  to: Token expired
                - value: error
                  to: Error
            - field: last_run
              label: Last run
            - field: last_added
              label: Added
            - field: last_rejected
              label: Rejected

- Listen:
    - Navidrome:
        icon: navidrome.svg
        href: https://{{HOMEPAGE_VAR_HOST}}/music/
        siteMonitor: https://{{HOMEPAGE_VAR_HOST}}/music/rest/ping.view
        widgets:
          - type: navidrome
            url: https://{{HOMEPAGE_VAR_HOST}}/music
            user: "{{HOMEPAGE_VAR_LAB_USER}}"
            token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
            salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
          - type: customapi
            # Newest albums.
            url: https://{{HOMEPAGE_VAR_HOST}}/music/rest/getAlbumList2?u={{HOMEPAGE_VAR_LAB_USER}}&t={{HOMEPAGE_VAR_NAVIDROME_TOKEN}}&s={{HOMEPAGE_VAR_NAVIDROME_SALT}}&v=1.16.1&c=homepage&f=json&type=newest&size=3
            refreshInterval: 300000
            display: dynamic-list
            mappings:
              items: subsonic-response.albumList2.album
              name: name
              label: artist
    - Lidarr:
        icon: lidarr.svg
        href: https://{{HOMEPAGE_VAR_HOST}}/lidarr/
        description: Add an album
        siteMonitor: http://127.0.0.1:8686/lidarr/ping
        widgets:
          # Not the lidarr widget: it loads the full 5 MB artist list on each refresh.
          - type: customapi
            url: http://127.0.0.1:8686/lidarr/api/v1/wanted/missing?pageSize=1
            headers:
              X-Api-Key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"
            mappings:
              - field: totalRecords
                label: Albums wanted
          - type: customapi
            # Newest albums it still looks for.
            url: http://127.0.0.1:8686/lidarr/api/v1/wanted/missing?pageSize=3&sortKey=albums.releaseDate&sortDirection=descending&includeArtist=true
            headers:
              X-Api-Key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"
            refreshInterval: 300000
            display: dynamic-list
            mappings:
              items: records
              name: title
              label: artist.artistName
    - slskd:
        icon: slskd.svg
        href: https://{{HOMEPAGE_VAR_HOST}}/slskd/
        siteMonitor: http://127.0.0.1:5030/slskd/health
        widget:
          type: slskd
          url: http://127.0.0.1:5030/slskd
          # slskd runs without a login behind the gate; the widget needs some key.
          key: none
          fields: ["slskStatus", "downloads", "uploads", "sharedFiles"]

    - Music downloads:
        icon: spotify.svg
        widget:
          type: customapi
          # Homepage serves the file itself; its Host check wants the lab's name.
          url: http://127.0.0.2:3010/status/downloads.json
          headers:
            Host: "{{HOMEPAGE_VAR_HOST}}"
          refreshInterval: 30000
          display: list
          mappings:
            - field: running
              label: Status
              remap:
                - value: true
                  to: Downloading
                - any: true
                  to: Idle
            - field: percent
              label: Progress
              suffix: "%"
            - field: done
              label: Downloaded
              additionalField:
                field: total
                prefix: of
            - field: failed
              label: Not found
            - field: last
              label: Last song

- Download:
    - qBittorrent:
        icon: qbittorrent.svg
        href: https://{{HOMEPAGE_VAR_HOST}}/qbit/
        siteMonitor: http://127.0.0.1:8081/api/v2/app/version
        widgets:
          - type: qbittorrent
            url: http://127.0.0.1:8081
            # qBittorrent trusts the gate's localhost address, so no login.
            username: ""
            password: ""
          - type: customapi
            # Newest torrents and how much of each is done.
            url: http://127.0.0.1:8081/api/v2/torrents/info?sort=added_on&reverse=true&limit=3
            display: dynamic-list
            mappings:
              name: name
              label: progress
              format: percent
              scale: 100
    - Sonarr:
        icon: sonarr.svg
        href: https://{{HOMEPAGE_VAR_HOST}}/sonarr/
        siteMonitor: http://127.0.0.1:8989/sonarr/ping
        widgets:
          - type: sonarr
            url: http://127.0.0.1:8989/sonarr
            key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          - type: customapi
            # Last episodes downloaded, from 'homelab recent', which adds the episode numbers.
            url: http://127.0.0.2:3010/status/recent.json
            headers:
              Host: "{{HOMEPAGE_VAR_HOST}}"
            refreshInterval: 60000
            display: dynamic-list
            mappings:
              items: sonarr
              name: name
              label: label
    - Radarr:
        icon: radarr.svg
        href: https://{{HOMEPAGE_VAR_HOST}}/radarr/
        siteMonitor: http://127.0.0.1:7878/radarr/ping
        widgets:
          - type: radarr
            url: http://127.0.0.1:7878/radarr
            key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          - type: customapi
            # Last movies downloaded, from 'homelab recent'.
            url: http://127.0.0.2:3010/status/recent.json
            headers:
              Host: "{{HOMEPAGE_VAR_HOST}}"
            refreshInterval: 60000
            display: dynamic-list
            mappings:
              items: radarr
              name: name
              label: label
    - Prowlarr:
        icon: prowlarr.svg
        href: https://{{HOMEPAGE_VAR_HOST}}/prowlarr/
        siteMonitor: http://127.0.0.1:9696/prowlarr/ping
        widget:
          type: prowlarr
          url: http://127.0.0.1:9696/prowlarr
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

