[package]
name = "homelab"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
getrandom = "0.4.3"
hex = "0.4.3"
lofty = "0.25.4"
md-5 = "0.11.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
unicode-normalization = "0.1.26"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
