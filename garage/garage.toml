# Single-node Garage: one copy of each object, stored under ~/homelab-data/garage.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/secrets/garage_rpc"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/secrets/garage_admin"
metrics_token_file = "/secrets/garage_metrics"
