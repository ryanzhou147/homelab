# Home lab: S3 storage, music, video and a hub page behind one login, reachable only over
# Tailscale. Caddy is the single entrance on the PC's Tailscale address; every service
# listens on 127.0.0.1 only.

x-local: &local
  restart: unless-stopped
  # No program inside a container can gain privileges through setuid binaries.
  security_opt: ["no-new-privileges:true"]

services:
  caddy:
    <<: *local
    image: caddy:2.11.7
    network_mode: host
    environment:
      HOST: ${HOST}
      TS_IP: ${TS_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./hub:/srv/hub:ro
      - ${DATA}/caddy:/data
      - ${DATA}/sockets:/sockets
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock

  authelia:
    <<: *local
    image: authelia/authelia:4.39.28
    ports: ["127.0.0.1:9091:9091"]
    environment:
      X_HOST: ${HOST}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/authelia_jwt
      AUTHELIA_SESSION_SECRET_FILE: /secrets/authelia_session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/authelia_storage
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/authelia_oidc_hmac
      X_AUTHELIA_CONFIG_FILTERS: template
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ${DATA}/authelia:/data
      - ${DATA}/secrets:/secrets:ro

  navidrome:
    <<: *local
    image: deluan/navidrome:0.64.2
    cap_drop: [ALL]
    # No TCP port: Navidrome listens on a root-owned socket that only Caddy mounts, so no other
    # program on the PC can reach it and forge the Remote-User login header.
    environment:
      ND_ADDRESS: unix:/sockets/navidrome.sock
      ND_UNIXSOCKETPERM: "0660"
      ND_BASEURL: /music
      ND_MUSICFOLDER: /music
      ND_EXTAUTH_USERHEADER: Remote-User
      ND_EXTAUTH_TRUSTEDSOURCES: "@"
      ND_SCANSCHEDULE: 1h
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
    volumes:
      - ${DATA}/navidrome:/data
      - ${MEDIA}/music:/music:ro
      - ${DATA}/sockets:/sockets

  garage:
    <<: *local
    image: dxflrs/garage:v2.4.1
    # Only the S3 API is published; the admin API (3903) stays on the compose network for the web UI.
    ports: ["127.0.0.1:3900:3900"]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ${DATA}/garage/meta:/var/lib/garage/meta
      - ${DATA}/garage/data:/var/lib/garage/data
      - ${DATA}/secrets:/secrets:ro

  garage-webui:
    <<: *local
    image: khairul169/garage-webui:1.1.0
    cap_drop: [ALL]
    ports: ["127.0.0.1:3909:3909"]
    environment:
      BASE_PATH: /storage
      API_BASE_URL: http://garage:3903
      S3_ENDPOINT_URL: http://garage:3900
    # API_ADMIN_KEY: the web UI cannot read Garage's admin_token_file itself.
    env_file: ${DATA}/secrets/garage-webui.env
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ${DATA}/secrets:/secrets:ro
    depends_on: [garage]

  jellyfin:
    <<: *local
    image: jellyfin/jellyfin:12.2
    user: "1000:1000"
    cap_drop: [ALL]
    ports: ["127.0.0.1:8096:8096"]
    environment:
      JELLYFIN_PublishedServerUrl: https://${HOST}/video
    # The SSO plugin calls Authelia at https://${HOST}/auth; resolve that to the Tailscale IP.
    extra_hosts:
      - "${HOST}:${TS_IP}"
    # Transcodes on the Ryzen's built-in graphics; the RTX 3060 is busy with the 27B.
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129
    group_add:
      - "${RENDER_GID}"
    volumes:
      - ${DATA}/jellyfin/config:/config
      - ${DATA}/jellyfin/cache:/cache
      - ${MEDIA}/video:/media/video:ro
    # fetch: Seerr checks who signs in and which shows exist through Jellyfin's own API.
    networks: [default, fetch]

  # Music fetching: Lidarr tracks the albums you want, Soularr asks slskd (a Soulseek client) for
  # them, and Lidarr files the downloads into ${MEDIA}/music for Navidrome. Run
  # scripts/start-music-fetch.sh once. The three apps share fetch-gate's network and listen on its
  # 127.0.0.1 only, so the PC reaches them only through the gate. The UIs trust Caddy's login
  # (admins only); the gate keeps out web pages that point their domain at 127.0.0.1.
  fetch-gate:
    <<: *local
    image: caddy:2.11.7
    ports:
      - "127.0.0.1:8686:18686"
      - "127.0.0.1:5030:15030"
      - "127.0.0.1:8989:18989"
      - "127.0.0.1:9696:19696"
      - "127.0.0.1:7878:17878"
      - "127.0.0.1:5055:15055"
      # 8080 on the PC is taken by another program.
      - "127.0.0.1:8081:18080"
    environment:
      HOST: ${HOST}
    volumes:
      - ./fetch-gate/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [fetch]

  lidarr:
    <<: *local
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls43
    network_mode: service:fetch-gate
    environment:
      PUID: "1000"
      PGID: "1000"
      LIDARR__SERVER__BINDADDRESS: 127.0.0.1
      LIDARR__SERVER__URLBASE: /lidarr
      # shortcut: no own login, so any local program can open the UI through the gate and read
      # the API key from it; use Forms login if other people get accounts on this PC.
      LIDARR__AUTH__METHOD: External
      LIDARR__LOG__ANALYTICSENABLED: "False"
    # LIDARR__AUTH__APIKEY, shared with Soularr.
    env_file: ${DATA}/secrets/lidarr.env
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8686/lidarr/ping"]
      interval: 30s
      start_period: 60s
      start_interval: 3s
    volumes:
      - ${DATA}/lidarr:/config
      # One mount for downloads and the library, so an import is a rename, not a copy.
      - ${MEDIA}:/data
    # Rejoin the gate's network when it restarts (docker compose restart fetch-gate).
    # shortcut: if Docker itself restarts a crashed gate, this does not act and the UI gives 502;
    # run docker compose restart fetch-gate. Add a watchdog if the gate ever crashes.
    depends_on: {fetch-gate: {condition: service_started, restart: true}}

  slskd:
    <<: *local
    image: slskd/slskd:0.26.1
    user: "1000:1000"
    cap_drop: [ALL]
    network_mode: service:fetch-gate
    environment:
      SLSKD_HTTP_IP_ADDRESS: 127.0.0.1
      SLSKD_HTTP_PORT: "5030"
      SLSKD_URL_BASE: /slskd
      SLSKD_NO_HTTPS: "true"
      # shortcut: no own login, so any local program can drive slskd through the gate; set
      # SLSKD_API_KEY and a web password if other people get accounts on this PC.
      SLSKD_NO_AUTH: "true"
      SLSKD_REMOTE_CONFIGURATION: "false"
      SLSKD_DOWNLOADS_DIR: /data/downloads/slskd
      SLSKD_INCOMPLETE_DIR: /data/downloads/incomplete
      # Nothing is shared, and the Soulseek port is not forwarded: only peers that accept
      # incoming connections can send files.
    # SLSKD_SLSK_USERNAME and SLSKD_SLSK_PASSWORD: the Soulseek account from the setup script.
    env_file: ${DATA}/secrets/slskd.env
    volumes:
      - ${DATA}/slskd:/app
      - ${MEDIA}/downloads:/data/downloads
    # Rejoin the gate's network when it restarts (docker compose restart fetch-gate).
    # shortcut: if Docker itself restarts a crashed gate, this does not act and the UI gives 502;
    # run docker compose restart fetch-gate. Add a watchdog if the gate ever crashes.
    depends_on: {fetch-gate: {condition: service_started, restart: true}}

  soularr:
    <<: *local
    image: mrusse08/soularr:v1.2.2
    user: "1000:1000"
    cap_drop: [ALL]
    network_mode: service:fetch-gate
    environment:
      SCRIPT_INTERVAL: "300"
      # Its web UI would listen on every address of the shared network, with no login.
      WEBUI_ENABLED: "false"
    volumes:
      # config.ini (holds the Lidarr API key) and Soularr's log.
      - ${DATA}/soularr:/data
      - ${MEDIA}/downloads/slskd:/downloads
    # Soularr's first run fails if Lidarr is still starting.
    depends_on:
      fetch-gate: {condition: service_started, restart: true}
      lidarr: {condition: service_healthy}
      slskd: {condition: service_started}

  # TV fetching, same pattern as music: Sonarr tracks the shows, Prowlarr finds releases and
  # qBittorrent downloads them. They share fetch-gate's network and listen on its 127.0.0.1 only.
  # Sonarr and qBittorrent both see ${MEDIA} at /data, so an import is a hardlink, not a copy.
  qbittorrent:
    <<: *local
    image: lscr.io/linuxserver/qbittorrent:5.0.4
    network_mode: service:fetch-gate
    environment:
      PUID: "1000"
      PGID: "1000"
      WEBUI_PORT: "8080"
    # qBittorrent.conf (set through its API, not in this repo) binds the web UI to 127.0.0.1 and
    # skips its login for requests from 127.0.0.1.
    # shortcut: every app on the gate's network, slskd too, can drive qBittorrent with no login;
    # set a WebUI password and give it to Sonarr if one of them is ever exposed.
    volumes:
      - ${DATA}/qbittorrent:/config
      - ${MEDIA}/downloads/qbittorrent:/data/downloads/qbittorrent
    depends_on: {fetch-gate: {condition: service_started, restart: true}}

  prowlarr:
    <<: *local
    image: lscr.io/linuxserver/prowlarr:1.37.0
    network_mode: service:fetch-gate
    environment:
      PUID: "1000"
      PGID: "1000"
      PROWLARR__SERVER__BINDADDRESS: 127.0.0.1
      PROWLARR__SERVER__URLBASE: /prowlarr
      PROWLARR__AUTH__METHOD: External
      PROWLARR__LOG__ANALYTICSENABLED: "False"
    volumes:
      - ${DATA}/prowlarr:/config
    depends_on: {fetch-gate: {condition: service_started, restart: true}}

  sonarr:
    <<: *local
    image: lscr.io/linuxserver/sonarr:4.0.14
    network_mode: service:fetch-gate
    environment:
      PUID: "1000"
      PGID: "1000"
      SONARR__SERVER__BINDADDRESS: 127.0.0.1
      SONARR__SERVER__URLBASE: /sonarr
      SONARR__AUTH__METHOD: External
      SONARR__LOG__ANALYTICSENABLED: "False"
    volumes:
      - ${DATA}/sonarr:/config
      - ${MEDIA}:/data
    depends_on: {fetch-gate: {condition: service_started, restart: true}}

  # Movies, the same way as Sonarr: files land in ${MEDIA}/video/movies for Jellyfin.
  radarr:
    <<: *local
    image: lscr.io/linuxserver/radarr:6.4.4
    network_mode: service:fetch-gate
    environment:
      PUID: "1000"
      PGID: "1000"
      RADARR__SERVER__BINDADDRESS: 127.0.0.1
      RADARR__SERVER__URLBASE: /radarr
      RADARR__AUTH__METHOD: External
      RADARR__LOG__ANALYTICSENABLED: "False"
    volumes:
      - ${DATA}/radarr:/config
      - ${MEDIA}:/data
    depends_on: {fetch-gate: {condition: service_started, restart: true}}

  # Requests from the phone: users sign in with their Jellyfin account and pick a show or movie,
  # and Seerr sends it to Sonarr or Radarr. Seerr has no URL base setting, so Caddy serves it on
  # its own port. It shares the gate's network: its setup page has no login until the first
  # Jellyfin sign-in, so only the gate may reach it. It reaches Jellyfin at host jellyfin, port 8096, URL base /video.
  # Create ${DATA}/seerr first, or Docker makes it as root and Seerr cannot write to it.
  seerr:
    <<: *local
    image: ghcr.io/seerr-team/seerr:v3.5.0
    init: true
    network_mode: service:fetch-gate
    environment:
      HOST: 127.0.0.1
      PORT: "5055"
    volumes:
      - ${DATA}/seerr:/app/config
    depends_on: {fetch-gate: {condition: service_started, restart: true}}

# A fixed range so a single firewall rule can let these containers reach Caddy on the Tailscale
# address (Jellyfin's SSO plugin talks to Authelia that way):
#   sudo ufw allow from 172.30.77.0/24 to <TS_IP> port 443 proto tcp
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24
  fetch:
    ipam:
      config:
        - subnet: 172.30.78.0/24
          # fetch-gate lets in only this address: Docker's port proxy.
          gateway: 172.30.78.1
