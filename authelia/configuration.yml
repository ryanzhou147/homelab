# Authelia: the one login in front of the home lab. Secrets arrive as *_FILE environment
# variables; the host name is templated from X_HOST.
server:
  address: 'tcp://:9091/auth'
log:
  level: info
theme: auto
authentication_backend:
  file:
    path: /data/users.yml
    watch: true
    password:
      algorithm: argon2
access_control:
  default_policy: deny
  rules:
    # The music fetchers write to the library:
    # only the admins group may open them.
    - domain: '{{ env "X_HOST" }}'
      resources: ['^/(lidarr|slskd)([/?].*)?$']
      subject: 'group:admins'
      policy: one_factor
    - domain: '{{ env "X_HOST" }}'
      resources: ['^/(lidarr|slskd)([/?].*)?$']
      policy: deny
    - domain: '{{ env "X_HOST" }}'
      policy: one_factor
session:
  cookies:
    - domain: '{{ env "X_HOST" }}'
      authelia_url: 'https://{{ env "X_HOST" }}/auth'
      default_redirection_url: 'https://{{ env "X_HOST" }}/'
  expiration: 12h
  inactivity: 2h
  remember_me: 1M
regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 15m
storage:
  local:
    path: /data/db.sqlite3
notifier:
  filesystem:
    filename: /data/notifications.txt
identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/authelia_oidc_key.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: jellyfin
        client_name: Jellyfin
        client_secret: '{{ secret "/secrets/jellyfin_oidc_digest" }}'
        public: false
        authorization_policy: one_factor
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - 'https://{{ env "X_HOST" }}/video/sso/OID/redirect/authelia'
        scopes: [openid, profile, groups]
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post
